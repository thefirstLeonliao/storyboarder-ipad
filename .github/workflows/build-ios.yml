# Storyboarder for iPad — 云端 macOS 构建【未签名 IPA】
# 所有构建步骤都在 scripts/ci-build-ios.sh（改构建直接改那个脚本，不用动本文件）。
name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build unsigned IPA (ci-build-ios.sh)
        run: bash scripts/ci-build-ios.sh
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Storyboarder-iPad-IPA
          path: build/Storyboarder.ipa
